  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n      <sc-for list=\"{{ navDash }}\" as=\"n\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:4px;\">\n      <div style=\"font-size:11px; font-weight:600; color:#8A90A8; padding:0 8px 6px;\">Operacional<\u002Fdiv>\n      <sc-for list=\"{{ navOps }}\" as=\"n\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:4px;\">\n      <div style=\"font-size:11px; font-weight:600; color:#8A90A8; padding:0 8px 6px;\">Ajustes<\u002Fdiv>\n      <sc-for list=\"{{ navConf }}\" as=\"n\" hint-placeholder-count=\"1\">\n        <button sc-camel-on-click=\"{{ n.onClick }}\" style=\"{{ n.style }}\">{{ n.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1; min-width:0; display:flex; flex-direction:column;\">\n\n    <header style=\"height:56px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid #E8EAF2; background:#FFFFFF; position:sticky; top:0; z-index:20;\">\n      <div style=\"display:flex; align-items:center; gap:8px; font-size:13.5px; color:#8A90A8;\">\n        <span>{{ pageGrupo }}<\u002Fspan><span style=\"color:#CDD2E4;\">/<\u002Fspan>\n        <span style=\"color:#1E2340; font-weight:600;\">{{ pageTitulo }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:10px;\">\n        <span style=\"font-size:12.5px; color:#8A90A8;\">Junho/26<\u002Fspan>\n        <span style=\"width:1px; height:18px; background:#E8EAF2;\"><\u002Fspan>\n        <span style=\"width:26px; height:26px; border-radius:50%; background:#E9EEFE; color:#28336B; font-size:11.5px; font-weight:600; display:flex; align-items:center; justify-content:center;\">RM<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"flex:1; padding:22px 24px 40px; display:flex; flex-direction:column; gap:16px;\">\n\n      <sc-if value=\"{{ isEficiencia }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex; flex-direction:column; gap:16px;\">\n      <div style=\"background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;\">\n        <div style=\"display:flex; align-items:baseline; gap:14px;\">\n          <span style=\"font-size:17px; font-weight:600;\">Eficiência de geração por porte de loja<\u002Fspan>\n          <span style=\"font-size:12.5px; color:#8A90A8;\">Junho/26 · 44 lojas · dados demonstrativos<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap;\">\n          <span style=\"font-size:12.5px; color:#8A90A8; margin-right:2px;\">Cluster<\u002Fspan>\n          <sc-for list=\"{{ clusterChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n          <span style=\"width:1px; height:22px; background:#E8EAF2; margin:0 6px;\"><\u002Fspan>\n          <sc-raw-select value=\"{{ regiao }}\" sc-camel-on-change=\"{{ onRegiao }}\" style=\"font-size:12.5px; padding:7px 10px; border:1px solid #DFE3F0; border-radius:8px; background:#FFF; color:#1E2340;\">\n            <sc-for list=\"{{ regioes }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <option value=\"{{ r }}\">{{ r }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isGeral }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n\n ;\">kg / R$ mil fat.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px; padding-top:12px; border-top:1px solid #EEF0F7; font-size:12.5px; color:#6B7291;\">Mediana da rede · faixa aceitável {{ faixaR }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:18px 20px;\">\n              <div style=\"font-size:13px; color:#6B7291; margin-bottom:6px;\">Lojas fora da curva no cluster<\u002Fdiv>\n              <div style=\"display:flex; align-items:baseline; gap:10px;\">\n                <span style=\"font-size:30px; font-weight:600; letter-spacing:-0.02em;\">{{ kpiOut }}<\u002Fspan>\n                <span style=\"font-size:13px; color:#8A90A8;\">de {{ kpiTotal }} lojas<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px; padding-top:12px; border-top:1px solid #EEF0F7; font-size:12.5px; color:#6B7291;\">{{ kpiOutDetalhe }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:20px 22px;\">\n            <div style=\"display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:4px;\">\n              <div>\n                <div style=\"font-size:16px; font-weight:600;\">{{ scatterTitulo }}<\u002Fdiv>\n                <div style=\"font-size:12.5px; color:#8A90A8; margin-top:3px;\">{{ scatterSub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:6px; background:#F2F4FB; padding:4px; border-radius:9px;\">\n                <button sc-camel-on-click=\"{{ setNR }}\" style=\"{{ tabNRStyle }}\">Não-recicláveis × FLV<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ setR }}\" style=\"{{ tabRStyle }}\">Recicláveis × faturamento<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"margin-top:14px; border:1px solid #EEF0F7 8A90A8; line-height:1.55;\">Premissas da base demonstrativa: faturamento de R$ 1,8 a R$ 15 mi por loja/mês, compra de FLV entre 8,5% e 11% do faturamento, geração de 25 a 31 kg de não-recicláveis por R$ mil de FLV e de 2,7 a 3,3 kg de recicláveis por R$ mil faturado. Ao plugar a base do cliente, os valores substituem estes sem mudar a leitura da tela.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start;\">\n            <div style=\"flex:1 1 380px; min-width:0; background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:20px 22px;\">\n              <div style=\"font-size:16px; font-weight:600;\">Quanto cada loja está fora do padrão<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#8A90A8; margin:3px 0 16px;\">Comparação com lojas do mesmo porte e o impacto em reais por mês. Clique para abrir a loja.<\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 56px 92px; gap:8px; padding:0 8px 8px; border-bottom:1px solid #EEF0F7; font-size:11.5px; color:#8A90A8;\">\n                <span>Loja · porte<\u002Fspan>\n                <span style=\"text-align:right;\">Desvio<\u002Fspan>\n                <span style=\"text-align:right; white-space:nowrap;\">{{ colunaReais }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:2px; margin-top:4px;\">\n                <sc-for list=\"{{ ranking }}\" as=\"l\" hint-placeholder-count=\"8\">\n                  <div sc-camel-on-click=\"{{ l.onClick }}\" style=\"display:grid; grid-template-columns:minmax(0,1fr) 56px 92px; align-items:center; gap:8px; padding:10px 8px; border-radius:8px; cursor:pointer;\" style-hover=\"background:#F7F8FD;\">\n                    <span style=\"min-width:0; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ l.nome }} <span style=\"font-size:11.5px; color:#8A90A8;\">· {{ l.cluster }}<\u002Fs de vendas, mix ou depósito fora do padrão do faturamento.<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-size:12.5px; color:#6B7291;\">{{ qtdManual }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"display:grid; grid-template-columns:minmax(150px,1.6fr) minmax(100px,1fr) minmax(96px,1fr) 132px; gap:12px; padding:16px 4px 10px; font-size:11.5px; color:#8A90A8;\">\n              <span>Loja<\u002Fspan><span>Região<\u002Fspan><span style=\"text-align:right;\">Faturamento<\u002Fspan><span style=\"text-align:center;\">Porte<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ porteLinhas }}\" as=\"l\" hint-placeholder-count=\"12\">\n              <div style=\"display:grid; grid-template-columns:minmax(150px,1.6fr) minmax(100px,1fr) minmax(96px,1fr) 132px; gap:12px; align-items:center; padding:9px 4px; border-top:1px solid #EEF0F7;\">\n                <span style=\"min-width:0; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ l.nome }}<\u002Fspan>\n                <span style=\"min-width:0; font-size:12.5px; color:#6B7291; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ l.regiao }}<\u002Fspan>\n                <span style=\"font-size:13px; text-align:right; white-space:nowrap;\">{{ l.fat }}<\u002Fspan>\n                <div style=\"display:flex; gap:4px; justify-content:center;\">\n                  <sc-for list=\"{{ l.opcoes }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCompliance }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:14px 18px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;\">\n            <span style=\"font-size:17px; font-weight:600;\">Compliance<\u002Fspan>\n            <span style=\"font-size:12.5px; color:#8A90A8;\">MTR, CDF e homologação dos parceiros alocados na operação<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px;\">\n            <sc-for list=\"{{ cpKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:18px 20px;\">\n                <div style=\"font-size:13px; color:#6B7291;\">{{ k.label }}<\u002Fdiv>\n                <div style=\"font-size:28px; font-weight:600; margin-top:6px; letter-spacing:-0.02em; color:{{ k.valorColor }}\">{{ k.valor }}<\u002Fdiv>\n                <div style=\"font-size:12.5px; margin-top:6px; color:{{ k.color }}\">{{ k.nota }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:20px 22px;\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;\">\n              <div>\n                <div style=\"font-size:16px; font-weight:600;\">MTR pendentes de baixa<\u002Fdiv>\n                <div style=\"font-size:12.5px; color:#8A90A8; margin-top:3px;\">Manifestos emitidos sem confirmação de recebimento pelo destinador dentro do prazo do estado<\u002Fdiv>\n              <\u002Fdiv>\n              <button style=\"{{ ctaStyle }}\" style-hover=\"filter:brightness(0.94)\">Cobrar baixa em lote<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:minmax(96px,0.9fr) minmax(96px,1.5fr) minmax(96px,1.5fr) minmax(56px,0.6fr) minmax(78px,0.8fr); gap:10px; padding:14px 10px 10px; font-size:11.5px; color:#8A90A8;\">\n              <sc-for list=\"{{ cpMtr.head }}\" as=\"h\" hint-placeholder-count=\"5\"><span style=\"text-align:{{ h.al }}\">{{ h.t }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ cpMtr.rows }}\" as=\"r\" hint-placeholder-count=\"7\">\n              <div style=\"display:grid; grid-template-columns:minmax(96px,0.9fr) minmax(96px,1.5fr) minmax(96px,1.5fr) minmax(56px,0.6fr) minmax(78px,0.8fr); gap:10px; padding:12px 10px; border-top:1px solid #EEF0F7; font-size:13px;\">\n                <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"5\">\n                  <span style=\"min-width:0; text-align:{{ c.al }}; color:{{ c.color }}; font-weight:{{ c.fw }}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ c.v }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start;\">\n            <div style=\"flex:1 1 380px; min-width:0; background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:20px 22px;\">\n              <div style=\"font-size:16px; font-weight:600;\">Homologação de parceiros<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#8A90A8; margin:3px 0 14px;\">Licença ambiental, CNPJ apto e contrato vigente para cada operador alocado<\u002Fdiv>\n              <sc-for list=\"{{ cpParceiros }}\" as=\"p\" hint-placeholder-count=\"6\">\n                <div style=\"display:grid; grid-template-columns:minmax(150px,1.6fr) minmax(140px,1.2fr) minmax(96px,0.8fr); gap:12px; align-items:center; padding:12px 0; border-top:1px solid #EEF0F7;\">\n                  <div style=\"min-width:0;\">\n                    <div style=\"font-size:13.5px; font-weight:600;\">{{ p.nome }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:#8A90A8; margin-top:2px;\">{{ p.papel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"min-width:0;\">\n                    <div style=\"font-size:12.5px; color:#6B7291; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ p.licenca }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:#9AA0B8; margin-top:2px;\">validade {{ p.validade }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:11.5px; font-weight:600; text-align:center; border-radius:6px; padding:5px 6px; white-space:nowrap; color:{{ p.statusColor }}; background:{{ p.statusBg }};\">{{ p.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"flex:1 1 300px; min-width:0; background:#FFFFFF; border:1px solid #E8EAF2; border-radius:12px; padding:20px 22px;\">\n              <div style=\"font-size:16px; font-weight:600;\">Certificados de Destinação Final<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#8A90A8; margin:3px 0 14px;\">CDF consolidado por destinador, emitido no fechamento do mês<\u002Fdiv>\n              <sc-for list=\"{{ cpCdf }}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-top:1px solid #EEF0F7;\">\n                  <div>\n                    <div style=\"font-size:13.5px; font-weight:600;\">{{ c.destinador }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:#8A90A8; margin-top:2px;\">{{ c.detalhe }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:11.5px; font-weight:600; border-radius:6px; padding:5px 10px; white-space:nowrap; color:{{ c.statusColor }}; background:{{ c.statusBg }};\">{{ c.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:16px; border:1px solid #EEF0F7; border-radius:10px; padding:14px 15px; background:#FAFBFF; font-size:12.5px; color:#4A5170; line-height:1.55;\">Dois CDFs seguram o fechamento de junho. Sem eles, 38 t destinadas ficam sem comprovação documental no inventário do cliente.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;clienteNome&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tauste Supermercados&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Marca do cliente&quot;},&quot;clienteLogo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;uploads/logo-1786023772377.png&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Marca do cliente&quot;},&quot;corDestaque&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0B3B6F&quot;,&quot;options&quot;:[&quot;#4C6FE7&quot;,&quot;#0B3B6F&quot;,&quot;#1F7A5A&quot;,&quot;#B4472E&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Marca do cliente&quot;}}\">\nclass Component extends DCLogic {\n  state = { view: 'geral', metric: 'nr', cluster: 'todos', regiao: 'Todas as regiões', sel: null, cmpA: null, cmpB: null };\n\n  rnd(seed) { let s = seed; return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; }\n\n  limites() { return { p: this.state.limiteP ?? 3000, m: this.state.limiteM ?? 8000 }; }\n\n  lojas() {\n    const base = this.baseLojas();\n    const { p, m } = this.limites();\n    const ov = this.state.overrides || {};\n    const lojas = base.map(l => ({ ...l, cluster: ov[l.id] || (l.fat < p ? 'P' : l.fat < m ? 'M' : 'G'), manual: !!ov[l.id] }));\n    const med = (arr) => { const s = arr.slice().sort((a, b) => a - b); const k = Math.floor(s.length / 2); return s.length ? (s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2) : 1; };\n    ['P', 'M', 'G'].forEach(cl => {\n      const g = lojas.filter(x => x.cluster === cl);\n      const mNR = med(g.map(x => x.intNR)) || 1, mR = med(g.map(x => x.intR)) || 1;\n      g.forEach(x => { x.medNR = mNR; x.medR = mR; x.devNR = (x.intNR - mNR) / mNR; x.devR = (x.intR - mR) / mR; });\n    });\n    return lojas;\n  }\n\n  baseLojas() {\n    if (this._lojas) return this._lojas;\n    const cidades = [\n      ['Bauru Centro','Bauru'],['Bauru Jd. Europa','Bauru'],['Bauru Vila Falcão','Bauru'],['Bauru Geisel','Bauru'],\n      ['Bauru Otávio Rasi','Bauru'],['Marília Centro','Marília'],['Marília Palmital','Marília'],['Marília Nova','Marília'],\n      ['Jaú Centro','Jaú'],['Jaú Chácara','Jaú'],['Lençóis Paulista','Lençóis'],['Agudos','Agudos'],\n      ['Pederneiras','Pederneiras'],['Botucatu Centro','Botucatu'],['Botucatu Vila Assunção','Botucatu'],\n      ['Avaré','Avaré'],['Lins Centro','Lins'],['Lins Jd. Aeroporto','Lins'],['Garça','Garça'],['Ourinhos','Ourinhos'],\n      ['Assis Centro','Assis'],['Assis Jd. Paulista','Assis'],['Piratininga','Bauru'],['Duartina','Bauru'],\n      ['São Manuel','Botucatu'],['Itapetininga','Itapetininga'],['Tatuí','Itapetininga'],['Boituva','Itapetininga'],\n      ['Jaú Norte','Jaú'],['Barra Bonita','Jaú'],['Igaraçu','Lins'],['Promissão','Lins'],\n      ['Marília Sul','Marília'],['Vera Cruz','Marília'],['Pompeia','Marília'],['Avaré Shopping','Avaré'],\n      ['Bauru Independência','Bauru'],['Bauru Bela Vista','Bauru'],['Ourinhos Norte','Ourinhos'],['Chavantes','Ourinhos'],\n      ['Cerqueira César','Avaré'],['Arandu','Avaré'],['Cabrália','Itapetininga'],['Laranjal','Itapetininga']\n    ];\n    const r = this.rnd(97);\n    const lojas = cidades.map((c, i) => {\n      const t = r();\n      const cluster = t < 0.4 ? 'P' : (t < 0.78 ? 'M' : 'G');\n      const fatBase = cluster === 'P' ? 2200 : cluster === 'M' ? 5200 : 11000;\n      const fat = Math.round(fatBase * (0.82 + r() * 0.42));\n      const flvShare = 0.085 + r() * 0.025;\n      const flv = Math.round(fat * flvShare);\n      let intNR = 28 * (0.9 + r() * 0.2);\n      let intR = 3.0 * (0.9 + r() * 0.2);\n      if (i % 11 === 3) intNR *= 1.55;\n      if (i % 13 === 5) intNR *= 1.38;\n      if (i % 9 === 2) intNR *= 0.68;\n      if (i % 12 === 7) intR *= 0.52;\n      if (i % 10 === 4) intR *= 0.63;\n      if (i % 14 === 1) intR *= 1.34;\n      return {\n        id: 'l' + i, nome: c[0], regiao: c[1], fat, flv,\n        nr: Math.round(intNR * flv), rec: Math.round(intR * fat),\n        intNR, intR, seed: i\n      };\n    });\n    this._lojas = lojas;\n    return lojas;\n  }\n\n  filtradas() {\n    return this.lojas().filter(l =>\n      (this.state.cluster === 'todos' || l.cluster === this.state.cluster) &&\n      (this.state.regiao === 'Todas as regiões' || l.regiao === this.state.regiao));\n  }\n\n  n(v, d) { return v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }); }\n  rs(v) { return v >= 1000 ? 'R$ ' + this.n(v / 1000, 1) + ' mi' : 'R$ ' + this.n(v, 0) + ' mil'; }\n  pct(v) { return (v >= 0 ? '+' : '−') + this.n(Math.abs(v) * 100, 0) + '%'; }\n\n  serieDe(loja, metric) {\n    const r = this.rnd(loja.seed * 31 + (metric === 'nr' ? 7 : 13));\n    const base = metric === 'nr' ? loja.intNR : loja.intR;\n    const meses = ['jul', 'ago', 'set', 'out', 'nov', 'dez', 'jan', 'fev', 'mar', 'abr', 'mai', 'jun'];\n    return meses.map((m, i) => {\n      const drift = 1 + (i / 11) * (loja.devNR > 0.2 && metric === 'nr' ? 0.22 : -0.04);\n      return { label: m, atual: base * drift * (0.9 + r() * 0.2), anterior: base * (0.93 + r() * 0.16) };\n    });\n  }\n\n  cell(v, al, color, fw) { return { v, al: al || 'right', color: color || '#1E2340', fw: fw || '400' }; }\n\n  paginas() {\n    const st = this.state, r = this.rnd(4321);\n    const lojas = this.lojas();\n    const paleta = { org: '#7E9AF8', pap: '#F2A97E', pla: '#5FA87C', rej: '#2E3D6B', oleo: '#E3C55E' };\n\n    // Overview — barras empilhadas por semana\n    const semanas = ['02/06', '09/06', '16/06', '23/06', '30/06', t:${(st.page || 'eficiencia') === key ? '600' : '400'};`,\n      onClick: () => this.setState({ page: key, view: 'geral' })\n    });\n    const lim = this.limites();\n    const ovr = st.overrides || {};\n    const porteBtn = (on, manual) => `font-family:inherit; font-size:12px; font-weight:600; width:38px; padding:6px 0; border-radius:7px; cursor:pointer; border:1px solid ${on ? 'transparent' : '#DFE3F0'}; background:${on ? (manual ? '#DDE6FE' : '#E9EEFE') : '#FFF'}; color:${on ? '#28336B' : '#9AA0B8'};`;\n    const setPorte = (id, c) => () => {\n      const novo = { ...(this.state.overrides || {}) };\n      const auto = all.find(l => l.id === id).fat < lim.p ? 'P' : all.find(l => l.id === id).fat < lim.m ? 'M' : 'G';\n      if (c === auto) delete novo[id]; else novo[id] = c;\n      this.setState({ overrides: novo });\n    };\n    const qtdP = all.filter(l => l.cluster === 'P').length, qtdM = all.filter(l => l.cluster === 'M').length, qtdG = all.filter(l => l.cluster === 'G').length;\n    const menor = Math.min(qtdP, qtdM, qtdG);\n\n    const titulos = { porte: ['Ajustes', 'Porte das lojas'], overview: ['Dashboards', 'Overview'], performance: ['Dashboards', 'Performance'], ambiental: ['Dashboards', 'Indicador Ambiental'], eficiencia: ['Dashboards', 'Indicador de Eficiência'], coletas: ['Operacional', 'Coletas'], financeiro: ['Operacional', 'Financeiro'], compliance: ['Operacional', 'Compliance'] };\n    const tit = titulos[st.page || 'eficiencia'];\n\n    return {\n      ...this.paginas(),\n      navDash: [navItem('overview', 'Overview'), navItem('performance', 'Performance'), navItem('ambiental', 'Indicador Ambiental'), navItem('eficiencia', 'Indicador de Eficiência')],\n      navOps: [navItem('coletas', 'Coletas'), navItem('financeiro', 'Financeiro'), navItem('compliance', 'Compliance')],\n      navConf: [navItem('porte', 'Porte das lojas')],\n      isPorte: st.page === 'porte',\n      limiteP: lim.p, limiteM: lim.m,\n      onLimiteP: e => { const v = Number(e.target.value); if (v > 0) this.setState({ limiteP: Math.min(v, this.limites().m - 250) }); },\n      onLimiteM: e => { const v = Number(e.target.value); if (v > 0) this.setState({ limiteM: Math.max(v, this.limites().p + 250) }); },\n      resetPorte: () => this.setState({ limiteP: 3000, limiteM: 8000, overrides: {} }),\n      porteResumo: [\n        { label: 'Porte P · pequenas', qtd: qtdP + ' lojas', faixa: 'até ' + this.rs(lim.p) + '/mês' },\n        { label: 'Porte M · médias', qtd: qtdM + ' lojas', faixa: this.rs(lim.p) + ' a ' + this.rs(lim.m) + '/mês' },\n        { label: 'Porte G · grandes', qtd: qtdG + ' lojas', faixa: 'acima de ' + this.rs(lim.m) + '/mês' }\n      ],\n      porteAviso: menor < 5\n        ? 'Um dos grupos ficou com menos de 5 lojas. Grupos pequenos tornam a mediana instável e o desvio de cada loja pouco confiável — vale ampliar a faixa.'\n        : 'Cada loja é comparada apenas com as do próprio grupo. Mudar as faixas recalcula na hora as medianas e os desvios de todas as telas.',\n      qtdManual: (() => { const n = Object.keys(ovr).length; return n === 0 ? 'Nenhuma loja ajustada manualmente' : n === 1 ? '1 loja ajustada manualmente' : n + ' lojas ajustadas manualmente'; })(),\n      porteLinhas: all.slice().sort((a, b) => b.fat - a.fat).map(l => ({\n        nome: l.nome, regiao: l.regiao, fat: this.rs(l.fat),\n        opcoes: ['P', 'M', 'G'].map(c => ({ label: c, style: porteBtn(l.cluster === c, l.manual), onClick: setPorte(l.id, c) }))\n      })),\n      pageGrupo: tit[0], pageTitulo: tit[1],\n      clienteNome: this.props.clienteNome ?? 'Tauste Supermercados',\n\n      isGeral: st.view === 'geral', isLoja: st.view === 'loja', isCompare: st.view === 'compare',\n      voltar: () => this.setState({ view: 'geral' }),\n      abrirComparar: () => this.setState({ view: 'compare', cmpA: sel.id }),\n      setNR: () => this.setState({ metric: 'nr' }), setR: () => this.setState({ metric: 'rec' }),\n      tabNRStyle: tab(isNR), tabRStyle: tab(!isNR),\n      ctaStyle: `font-size:13px; font-weight:600; padding:9px 14px; border-radius:8px; border:none; cursor:pointer; color:#FFF; background:${accent};`,\n      clusterChips: ['todos', 'P', 'M', 'G'].map(c => ({\n        label: c === 'todos' ? 'Todos' : c, style: chipStyle(st.cluster === c), onClick: () => this.setState({ cluster: c })\n      })),\n      regioes: ['Todas as regiões', ...Array.from(new Set(all.map(l => l.regiao))).sort()],\n      regiao: st.regiao, onRegiao: e => this.setState({ regiao: e.target.value }),\n      kpiNR: this.n(medRedeNR, 1), kpiR: this.n(medRedeR, 1),\n      faixaNR: this.n(medRedeNR * 0.82, 0) + '–' + this.n(medRedeNR * 1.18, 0),\n      faixaR: this.n(medRedeR * 0.82, 1) + '–' + this.n(medRedeR * 1.18, 1),\n      kpiOut: isNR ? forasNR : forasR, kpiTotal: lojas.length,\n      kpiOutDetalhe: isNR ? 'Mais de 18% acima do padrão de lojas do mesmo porte' : 'Mais de 18% abaixo do padrão de lojas do mesmo porte',\n      scatterTitulo: isNR ? 'Não-recicláveis por R$ mil de FLV — despesa, quanto menor melhor' : 'Recicláveis por R$ mil faturado — receita, quanto maior melhor',\n      scatterSub: isNR ? 'Cada ponto é uma loja, comparada à mediana do próprio cluster. Acima da faixa, sobra resíduo para o FLV que entra na loja: perda de mercadoria e custo de destinação.' : 'Cada ponto é uma loja, comparada à mediana do próprio cluster. Abaixo da faixa, falta reciclável para o faturamento declarado: material que deveria virar receita não chega à doca.',\n      legenda: isNR ? [\n        { fill: '#F6B0A2', stroke: '#E4705A', label: 'Acima do esperado — despesa: perda de FLV virando resíduo' },\n        { fill: '#C7D3FE', stroke: '#7E9AF8', label: 'Dentro da faixa do cluster' },\n        { fill: '#A9DCBC', stroke: '#3F7D57', label: 'Abaixo do esperado — menos perda (confirmar registro de coleta)' }\n      ] : [\n        { fill: '#A9DCBC', stroke: '#3F7D57', label: 'Acima do esperado — receita: mais material recuperado' },\n        { fill: '#C7D3FE', stroke: '#7E9AF8', label: 'Dentro da faixa do cluster' },\n        { fill: '#F6B0A2', stroke: '#E4705A', label: 'Abaixo do esperado — receita perdida, possível desvio' }\n      ],\n      headline: isNR\n        ? `${nFora} lojas jogam fora mais mercadoria que as lojas do mesmo porte. Somadas, isso equivale a R$ ${this.n(Math.abs(perdaTotal) / 1000, 0)} mil por mês em FLV perdido e destinação — cada ponto acima da faixa azul é uma dessas lojas.`\n        : `${nFora} lojas entregam menos reciclável que as lojas do mesmo porte, com o mesmo faturamento. São R$ ${this.n(Math.abs(perdaTotal) / 1000, 0)} mil por mês que deixam de entrar na venda de material — cada ponto abaixo da faixa azul é uma dessas lojas.`,\n      tip: (() => {\n        const h = lojas.find(l => l.id === st.hover);\n        if (!h) return { on: false, style: 'display:none', nome: '', linha1: '', linha2: '' };\n        const d = dev(h), imp = impacto(h);\n        const cx = Math.min(Math.max(px(h), 200), 790);\n        return {\n          on: true,\n          style: `position:absolute; left:${(cx / 980) * 100}%; top:${(py(d) / VB) * 100}%; transform:translate(-50%,calc(-100% - 14px)); background:#1E2340; color:#FFF; border-radius:9px; padding:9px 12px; pointer-events:none; white-space:nowrap; box-shadow:0 6px 18px rgba(30,35,64,0.22); z-index:5;`,\n          nome: h.nome,\n          linha1: `Porte ${h.cluster} · ${h.regiao} · ${this.rs(h.fat)}/mês`,\n          linha2: `${this.pct(d)} vs lojas do mesmo porte · ${fmtImp(imp)}/mês`\n        };\n      })(),\n      chart: {\n        points, yTicks, xTicks, bandPoints: bandPts, lanes, rotulos,\n        line: { x1: X0, y1: py(0), x2: X1, y2: py(0) },\n        xLabel: '',\n        yLabel: isNR ? '↑ mais resíduo por R$ de FLV que as pares · ↓ menos' : '↑ mais reciclável por R$ faturado que as pares · ↓ menos'\n      },\n      ranking,\n      colunaReais: isNR ? 'Custo/mês' : 'Receita/mês',\n      insights: [\n        { tag: 'Despesa', tagColor: '#C6503A', titulo: this.n(forasNR, 0) + ' lojas acima da faixa de não-recicláveis', texto: 'Compram FLV em linha com as pares do mesmo cluster, mas descartam mais. A conta aparece duas vezes: na mercadoria perdida e no custo de destinação.' },\n        { tag: 'Receita perdida', tagColor: '#B5811F', titulo: this.n(lojas.filter(l => l.devR < -0.18).length, 0) + ' lojas com reciclável abaixo do esperado', texto: 'Faturamento equivalente ao das pares e menos papelão e plástico saindo pela doca. Material reciclável é receita: o que não entra no fluxo contratado deixa de ser vendido. Primeiro alvo de auditoria.' },\n        { tag: 'Referência', tagColor: '#3F7D57', titulo: 'Lojas dentro da faixa nos dois eixos', texto: 'Servem de baseline do cluster: mesma rotina de recebimento e prensagem pode ser replicada nas unidades fora da curva.' }\n      ],\n      loja: { nome: sel.nome, cluster: sel.cluster, regiao: sel.regiao, fatFmt: this.rs(sel.fat), flvFmt: this.rs(sel.flv) },\n      lojaKpis, hipoteses: hip,\n      serieTitulo: isNR ? 'não-recicláveis por R$ mil de FLV' : 'recicláveis por R$ mil de faturamento',\n      serie: { bars, anterior, grid, medianaY: 200 - (medBase / sMax) * 190 },\n      opcoes: all.map(l => ({ id: l.id, nome: l.nome + ' · ' + l.cluster })),\n      cmpA: cmpA.id, cmpB: cmpB.id,\n      onCmpA: e => this.setState({ cmpA: e.target.value }), onCmpB: e => this.setState({ cmpB: e.target.value }),\n      linhas, conclusao\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
